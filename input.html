<!DOCTYPE html>
<html>
<head>
  <title>Input Penjualan - Kalisari27</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    :root {
      --bg: #f4f6f9;
      --card: #ffffff;
      --text: #2c3e50;
      --subtext: #777;
      --border: #ddd;
      --primary: #3498db;
      --success: #2ecc71;
      --danger: #e74c3c;
    }
    html.dark {
      --bg: #1a1d21;
      --card: #2c3136;
      --text: #ecf0f1;
      --subtext: #bdc3c7;
      --border: #444;
      --primary: #2980b9;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
    body { background: var(--bg); padding: 20px; color: var(--text); transition: 0.3s; }
.container { max-width: 600px; margin: auto; }
.header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
.back { display: inline-block; text-decoration: none; color: var(--primary); font-weight: bold; }
.btn-theme { background: var(--card); color: var(--text); border: 1px solid var(--border); font-size: 18px; padding: 8px 12px; border-radius: 8px; cursor: pointer; }

.box { background: var(--card); padding: 25px; border-radius: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
.box h2 { margin-bottom: 20px; text-align: center; color: var(--text); }

  label { font-weight: bold; font-size: 14px; margin-top: 10px; display: block; color: var(--text); }
  input, select { width: 100%; padding: 12px; margin: 8px 0 15px 0; border: 1px solid var(--border); border-radius: 8px; font-size: 15px; background: var(--bg); color: var(--text); }
.btn { background: var(--success); color: white; padding: 14px; border: none; border-radius: 8px; width: 100%; font-size: 16px; font-weight: bold; cursor: pointer; }
.btn:hover { background: #27ae60; }
.msg { text-align: center; margin-top: 10px; font-weight: bold; }
.error { color: var(--danger); }.success { color: var(--success); }
.badge-psm { background: #9b59b6; color: white; font-size: 10px; padding: 3px 8px; border-radius: 5px; margin-left: 8px; }
.hidden { display: none; }

    footer { text-align: center; padding: 20px; margin-top: 30px; color: var(--subtext); font-size: 16px; border-top: 1px solid var(--border); }
    footer b { color: var(--text); }
  </style>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>
  <div class="container">
    <div class="header">
      <a href="dashboard.html" class="back">← Kembali ke Dashboard</a>
      <button class="btn-theme" id="btnTheme">🌙</button>
    </div>

    <div class="box">
      <h2>➕ Input Penjualan</h2>

      <label>Pilih Program</label>
      <select id="selectProgram">
        <option value="">-- Pilih Program --</option>
      </select>

      <!-- INI MUNCUL KALAU PSM -->
      <div id="boxItemPsm" class="hidden">
        <label>Pilih Item PSM <span style="font-weight:normal; color:var(--subtext);">Max 10 Item</span></label>
        <select id="selectItemPsm">
          <option value="">-- Pilih Item --</option>
        </select>
      </div>

      <label>Qty Terjual</label>
      <input type="number" id="qty" placeholder="Contoh: 1" min="1">

      <label>Tanggal Penjualan</label>
      <input type="date" id="tanggal">

      <button class="btn" onclick="simpanPenjualan()">SIMPAN</button>
      <p id="msg" class="msg"></p>
    </div>

    <footer>Powered by <b>DevancaProject</b> © 2026</footer>
  </div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyAcXcQndDOfBrpgGhGRWDnD8vn0XX4npP8",
    authDomain: "devancaproject.firebaseapp.com",
    databaseURL: "https://devancaproject-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "devancaproject",
    storageBucket: "devancaproject.firebasestorage.app",
    messagingSenderId: "435221444634",
    appId: "1:435221444634:web:7fe0f742fbfa9c448239a3"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  let currentUser = localStorage.getItem('currentUser');
  let semuaProgram = {};

  // ===== LOGIC DARK MODE GLOBAL =====
  const btnTheme = document.getElementById('btnTheme');
  const currentTheme = localStorage.getItem('theme');
  if(currentTheme === 'dark'){
    document.documentElement.classList.add('dark');
    btnTheme.innerText = '☀️';
  }

  btnTheme.addEventListener('click', () => {
    document.documentElement.classList.toggle('dark');
    if(document.documentElement.classList.contains('dark')){
      localStorage.setItem('theme', 'dark');
      btnTheme.innerText = '☀️';
    } else {
      localStorage.setItem('theme', 'light');
      btnTheme.innerText = '🌙';
    }
  });

  // 1. LOAD DATA PROGRAM KE DROPDOWN
  db.ref('program').on('value', (snapshot) => {
    semuaProgram = {};
    let select = document.getElementById('selectProgram');
    select.innerHTML = '<option value="">-- Pilih Program --</option>';
    snapshot.forEach(child => {
      let id = child.key;
      let data = child.val();
      semuaProgram[id] = data;
      let badge = data.is_psm? `<span class="badge-psm">PSM</span>` : '';
      select.innerHTML += `<option value="${id}">${data.nama} ${badge}</option>`;
    });
  });

  // 2. EVENT KETIKA GANTI PROGRAM
  document.getElementById('selectProgram').addEventListener('change', function(){
    let program_id = this.value;
    let boxItem = document.getElementById('boxItemPsm');
    let selectItem = document.getElementById('selectItemPsm');

    if(program_id && semuaProgram[program_id]?.is_psm){
      // Kalau PSM, tampilin dropdown item
      boxItem.classList.remove('hidden');
      selectItem.innerHTML = '<option value="">-- Pilih Item --</option>';
      let items = semuaProgram[program_id].items || [];
      items.forEach((item, index) => {
        if(item) selectItem.innerHTML += `<option value="${index}">${index+1}. ${item}</option>`;
      });
    } else {
      // Kalau bukan PSM, sembunyiin
      boxItem.classList.add('hidden');
      selectItem.value = '';
    }
  });

  // 3. SET DEFAULT TANGGAL HARI INI
  window.onload = function(){
    let today = new Date().toISOString().split('T')[0];
    document.getElementById('tanggal').value = today;
  }

  // 4. FUNGSI SIMPAN
  function simpanPenjualan(){
    let program_id = document.getElementById('selectProgram').value;
    let program = semuaProgram[program_id];
    let program_nama = program?.nama || '';
    let qty = document.getElementById('qty').value;
    let tanggal = document.getElementById('tanggal').value;
    let item_id = document.getElementById('selectItemPsm').value;
    let msg = document.getElementById('msg');

    if(program_id == '' || qty == '' || tanggal == ''){
      msg.innerText = 'Program, Qty dan Tanggal wajib diisi';
      msg.className = 'msg error';
      return;
    }
    if(program?.is_psm && item_id === ''){
      msg.innerText = 'Pilih Item PSM dulu';
      msg.className = 'msg error';
      return;
    }
    if(Number(qty) <= 0){
      msg.innerText = 'Qty harus lebih dari 0';
      msg.className = 'msg error';
      return;
    }

    let data = {
      program_id: program_id,
      program_nama: program_nama,
      qty: Number(qty),
      user: currentUser,
      tanggal: tanggal, // format YYYY-MM-DD
      is_psm: program?.is_psm || false, // TAMBAHAN
      item_id: program?.is_psm? Number(item_id) : null, // TAMBAHAN
      createdAt: new Date().toISOString()
    };

    db.ref('penjualan').push(data).then(()=>{
      msg.innerText = 'Data penjualan berhasil disimpan';
      msg.className = 'msg success';
      document.getElementById('qty').value = '';
      document.getElementById('selectProgram').value = '';
      document.getElementById('boxItemPsm').classList.add('hidden');
    }).catch((error)=>{
      msg.innerText = 'Gagal: ' + error.message;
      msg.className = 'msg error';
    });
  }
</script>
</body>
</html>
