<!DOCTYPE html>
<html>
<head>
  <title>Input Penjualan - Kalisari27</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap');
    :root { --bg:#f4f6f9; --card:#ffffff; --text:#2c3e50; --subtext:#777; --border:#e0e0e0; --primary:#667eea; --primary-glow:rgba(102,126,234,0.15); --success:#2ecc71; --danger:#e74c3c; --navbar:rgba(255,255,255,0.85); --sidebar-bg:rgba(255,255,255,0.9); --card2:#f0f2f5; }
    body.dark { --bg:#121212; --card:#1e1e1e; --text:#ecf0f1; --subtext:#bdc3c7; --border:#333; --card2:#252525; --navbar:rgba(30,30,30,0.85); --sidebar-bg:rgba(30,30,30,0.9); }
    *{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}
    body{background:var(--bg);color:var(--text);padding-top:70px;padding-bottom:90px;}
.navbar{position:fixed;top:0;left:0;right:0;background:var(--navbar);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:8px 15px;display:flex;justify-content:space-between;align-items:center;z-index:1000;height:55px;}
.logo-img{height:48px;background:white;padding:4px 10px;border-radius:8px;border:2px solid #E30613;}
.menu-btn{width:44px;height:44px;background:var(--primary-glow);border:none;border-radius:12px;cursor:pointer;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:5px;margin-left:auto;margin-right:10px;}
.menu-btn span{display:block;width:22px;height:3px;background:var(--primary);border-radius:3px;transition:0.3s;}
.menu-btn.active span:nth-child(1){transform:rotate(45deg) translate(5px,5px);}.menu-btn.active span:nth-child(2){opacity:0;}.menu-btn.active span:nth-child(3){transform:rotate(-45deg) translate(5px,-5px);}
.theme-toggle{width:60px;height:32px;background:var(--border);border-radius:50px;position:relative;cursor:pointer;display:flex;align-items:center;justify-content:space-between;padding:0 6px;}
.sidebar{position:fixed;top:0;left:-290px;width:280px;height:100%;background:var(--sidebar-bg);backdrop-filter:blur(20px);border-right:1px solid var(--border);transition:left 0.4s;z-index:1001;padding-top:70px;}
.sidebar.active{left:0;}.sidebar a,.sidebar button{display:flex;align-items:center;gap:16px;padding:16px 20px;margin:5px 12px;border-radius:12px;color:var(--text);text-decoration:none;font-weight:600;border:none;background:none;cursor:pointer;font-size:15px;width:calc(100% - 24px);text-align:left;}.sidebar a:hover,.sidebar button:hover{background:var(--primary);color:white;}.admin-section{border-top:1px solid var(--border);margin:15px 12px 0 12px;padding-top:10px;display:none;}.logout-btn{color:var(--danger)!important;}.overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.4);opacity:0;visibility:hidden;transition:0.3s;z-index:1000;}.overlay.active{opacity:1;visibility:visible;}
.container{max-width:600px;margin:auto;padding:20px}.box{background:var(--card);padding:25px;border-radius:16px;box-shadow:0 4px 20px rgba(0,0,0,0.05);border:1px solid var(--border);border-left:5px solid var(--primary);}.box h2{margin-bottom:20px;text-align:center} label{font-weight:bold;font-size:14px;margin-top:10px;display:block} input,select{width:100%;padding:12px;margin:8px 0 15px 0;border:1px solid var(--border);border-radius:8px;font-size:15px;background:var(--bg);color:var(--text)}.btn{background:var(--success);color:white;padding:14px;border:none;border-radius:8px;width:100%;font-size:16px;font-weight:bold;cursor:pointer}.msg{text-align:center;margin-top:10px;font-weight:bold}.error{color:var(--danger)}.success{color:var(--success)}.hidden{display:none} footer{text-align:center;padding:20px;margin-top:30px;color:var(--subtext);font-size:14px;border-top:1px solid var(--border)}

/* BOTTOM NAV CLEAN 64px */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;height:64px;background:rgba(255,255,255,0.92);backdrop-filter:blur(16px);border-top:1px solid var(--border);display:flex;justify-content:space-around;align-items:center;z-index:9997;padding:0 6px}
.nav-item{display:flex;flex-direction:column;align-items:center;justify-content:center;text-decoration:none;color:var(--subtext);font-size:9.5px;font-weight:700;flex:1;height:100%;gap:3px;border:none;background:none;position:relative}
.nav-icon svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.9}
.nav-item.active{color:#8B4513}.nav-item.active::after{content:'';position:absolute;top:6px;width:4px;height:4px;background:#8B4513;border-radius:50%}
.nav-center-wrap{flex:1;display:flex;justify-content:center}
.nav-center{width:46px;height:46px;background:linear-gradient(135deg,#8B4513,#FF8C42);border-radius:14px;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(139,69,19,.35);border:none;margin-top:-8px;transition:.3s;cursor:pointer}
.nav-center.active{transform:rotate(180deg);background:#222}
.nav-center svg{width:22px;height:22px;stroke:white;fill:none;stroke-width:2.2}

/* TARGET SHEET */
.t-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);backdrop-filter:blur(3px);opacity:0;visibility:hidden;transition:.3s;z-index:9998}
.t-overlay.show{opacity:1;visibility:visible}
.t-sheet{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-radius:22px 22px 0 0;padding:16px 18px 22px;transform:translateY(110%);transition:.4s;z-index:9999;max-height:78vh;overflow-y:auto}
.t-sheet.show{transform:translateY(0)}
.handle{width:36px;height:4px;background:var(--border);border-radius:10px;margin:0 auto 14px}
.t-item{display:flex;justify-content:space-between;align-items:center;background:var(--card2);border:1px solid var(--border);padding:11px 12px;border-radius:10px;margin-bottom:8px}
.t-total{background:#FFF3CD;border:1px solid #FFC107;color:#856404;padding:12px;border-radius:10px;text-align:center;font-weight:800;margin-top:10px;font-size:13px}
  </style>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>
  <div class="navbar"><img src="logo-kalisari27.png" class="logo-img"><button class="menu-btn" id="menuBtn" onclick="toggleMenu()"><span></span><span></span><span></span></button><div class="theme-toggle" id="btnTheme"><span>☀️</span><span>🌙</span></div></div>
  <div class="sidebar" id="sidebar">
    <div style="padding:16px 20px;background:var(--primary-glow);margin:10px 12px;border-radius:12px;font-weight:700;">Halo, <span id="namaUserSidebar"></span> </div>
    <a href="dashboard.html">🏠 Dashboard</a>
    <a href="stockopname.html">📦 Stok Opname</a>
    <a href="laporan.html">📊 Laporan</a>
    <a href="profil.html">👤 Profil</a>
    <div class="admin-section" id="adminSection"><a href="setting.html">⚙️ Setting Hari</a></div>
    <button class="logout-btn" onclick="logout()">🚪 Logout</button>
  </div>
  <div class="overlay" id="overlay" onclick="toggleMenu()"></div>

  <div class="container">
    <div class="box">
      <h2>➕ Input Penjualan</h2>
      <label>Pilih Program</label><select id="selectProgram"><option>-- Pilih Program --</option></select>
      <div id="boxItemPsm" class="hidden"><label>Pilih Item PSM</label><select id="selectItemPsm"><option>-- Pilih Item --</option></select></div>
      <label>Qty Terjual</label><input type="number" id="qty" placeholder="Contoh: 1" min="1">
      <label>Tanggal</label><input type="date" id="tanggal">
      <button class="btn" onclick="simpanPenjualan()">SIMPAN</button><p id="msg" class="msg"></p>
    </div>
    <footer>Powered by <b>DevancaProject</b> © 2026</footer>
  </div>

  <div class="bottom-nav">
    <a href="dashboard.html" class="nav-item"><span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1h-5v-4a1 1 0 0 0-1-1h-2a1 1 0 0 0-1 1v4H4a1 1 0 0 1-1-1V9.5z"/></svg></span><span>Home</span></a>
    <a href="input.html" class="nav-item active"><span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></span><span>Input</span></a>
    <div class="nav-center-wrap"><button class="nav-center" id="btnMid" onclick="toggleTarget()"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 8v4l2.5 2"/></svg></button></div>
    <a href="stockopname.html" class="nav-item"><span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><path d="M3.3 7L12 12l8.7-5"/><path d="M12 22V12"/></svg></span><span>Stok</span></a>
    <a href="laporan.html" class="nav-item"><span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/></svg></span><span>Laporan</span></a>
  </div>

  <div id="tOverlay" class="t-overlay" onclick="toggleTarget()"></div>
  <div id="tSheet" class="t-sheet">
    <div class="handle"></div>
    <div style="display:flex;justify-content:space-between;margin-bottom:12px"><h4 style="font-size:14px">🎯 Target Hari Ini</h4><small id="tDate" style="color:var(--subtext)"></small></div>
    <div id="tContent">Loading...</div>
  </div>

<script>
  const firebaseConfig={apiKey:"AIzaSyAcXcQndDOfBrpgGhGRWDnD8vn0XX4npP8",authDomain:"devancaproject.firebaseapp.com",databaseURL:"https://devancaproject-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"devancaproject",storageBucket:"devancaproject.firebasestorage.app",messagingSenderId:"435221444634",appId:"1:435221444634:web:7fe0f742fbfa9c448239a3"};
  firebase.initializeApp(firebaseConfig);const db=firebase.database();
  let currentUser=localStorage.getItem('currentUser')||'kasir1';
  document.getElementById('namaUserSidebar').innerText=currentUser;
  if(currentUser==='admin'){document.getElementById('adminSection').style.display='block';}
  let semuaProgram={};
  function toggleMenu(){document.getElementById('sidebar').classList.toggle('active');document.getElementById('overlay').classList.toggle('active');document.getElementById('menuBtn').classList.toggle('active');}
  function logout(){localStorage.clear();window.location='index.html';}
  const btnTheme=document.getElementById('btnTheme');
  if(localStorage.getItem('theme')==='dark'){document.body.classList.add('dark');}
  btnTheme.addEventListener('click',()=>{document.body.classList.toggle('dark');localStorage.setItem('theme',document.body.classList.contains('dark')?'dark':'light');});
  db.ref('program').on('value',snap=>{
    let select=document.getElementById('selectProgram');
    select.innerHTML='<option value="">-- Pilih Program --</option>';
    snap.forEach(child=>{
      let id=child.key;let data=child.val();if(data.is_hidden) return;
      semuaProgram[id]=data;
      let catatan=data.catatan?` (${data.catatan})`:'';let badge=data.is_psm?' [PSM]':'';
      select.innerHTML+=`<option value="${id}">${data.nama}${catatan}${badge}</option>`;
    });
  });
  document.getElementById('selectProgram').addEventListener('change',function(){
    let program_id=this.value;let boxItem=document.getElementById('boxItemPsm');
    let selectItem=document.getElementById('selectItemPsm');
    let prog=semuaProgram[program_id];
    if(program_id&&prog?.is_psm){
      boxItem.classList.remove('hidden');
      selectItem.innerHTML='<option value="">-- Pilih Item --</option>';
      db.ref('program/'+program_id+'/items').once('value').then(snap=>{
        snap.forEach(child=>{let k=child.key;let d=child.val();if(d&&d.nama){let cat=d.catatan?` (${d.catatan})`:'';selectItem.innerHTML+=`<option value="${k}">${d.nama}${cat}</option>`;}});
      });
    }else{boxItem.classList.add('hidden');}
  });
  window.onload=()=>{document.getElementById('tanggal').value=new Date().toISOString().split('T')[0];}
  function simpanPenjualan(){
    let program_id=document.getElementById('selectProgram').value;
    let program=semuaProgram[program_id];
    let qty=document.getElementById('qty').value;
    let tanggal=document.getElementById('tanggal').value;
    let item_id=document.getElementById('selectItemPsm').value;
    let item_nama=document.getElementById('selectItemPsm').options[document.getElementById('selectItemPsm').selectedIndex]?.text||'';
    let msg=document.getElementById('msg');
    if(program_id==''||qty==''||tanggal==''){msg.innerText='Program, Qty dan Tanggal wajib diisi';msg.className='msg error';return;}
    if(program?.is_psm&&item_id===''){msg.innerText='Pilih Item PSM dulu';msg.className='msg error';return;}
    let data={program_id,program_nama:program?.nama||'',item_id:program?.is_psm?item_id:null,item_nama:program?.is_psm?item_nama:null,qty:Number(qty),user:currentUser,tanggal,is_psm:program?.is_psm||false,createdAt:Date.now()};
    db.ref('penjualan').push(data).then(()=>{
      msg.innerText='✅ Berhasil disimpan';msg.className='msg success';
      document.getElementById('qty').value='';document.getElementById('selectProgram').value='';document.getElementById('boxItemPsm').classList.add('hidden');
      setTimeout(()=>msg.innerText='',3000);
    }).catch(e=>{msg.innerText='❌ '+e.message;msg.className='msg error';});
  }

    // PINTASAN TARGET HARI INI
  function toggleTarget(){
    document.getElementById('targetSheet').classList.toggle('show');
    document.getElementById('targetOverlay').classList.toggle('show');
    document.getElementById('btnShortcut').classList.toggle('active');
    if(document.getElementById('targetSheet').classList.contains('show')) loadTargetHariIni();
  }
  function loadTargetHariIni(){
    const bulanIni = new Date().getMonth()+1;
    const tahunIni = new Date().getFullYear();
    const hariIni = new Date().getDate();
    document.getElementById('targetTanggal').innerText = new Date().toLocaleDateString('id-ID',{weekday:'long', day:'numeric', month:'long'});
    let html = '';
    let totalSisa = 0;
    for(let id in semuaProgram){
      let prog = semuaProgram[id];
      if(prog.is_psm) continue;
      let target = prog.target||0;
      let terjual = 0;
      semuaPenjualan.forEach(j=>{
        let t = new Date(j.tanggal);
        if(j.program_id==id && t.getMonth()+1==bulanIni && t.getFullYear()==tahunIni) terjual+=j.qty||0;
      });
      let sisa = target - terjual; if(sisa<0) sisa=0;
      let hariKerja = prog.hari_kerja||22;
      let sisaHari = hariKerja - (hariIni-1); if(sisaHari<1) sisaHari=1;
      let kejar = Math.ceil(sisa/sisaHari);
      totalSisa+=sisa;
      let persen = target>0? Math.round(terjual/target*100):0;
      html+=`<div class="target-item"><div><b>${prog.nama}</b><br><small>${terjual}/${target} • ${persen}%</small></div><div style="text-align:right"><b style="color:${sisa==0?'var(--success)':'var(--danger)'}">${sisa==0?'✅ Lunas': sisa+' Qty'}</b><br><small>Kejar ${kejar}/hari</small></div></div>`;
    }
    if(html=='') html='<p style="text-align:center; color:var(--subtext)">Belum ada program reguler</p>';
    else html+=`<div class="target-kejar">Total sisa hari ini: ${totalSisa} Qty harus dikejar 🔥</div>`;
    document.getElementById('targetContent').innerHTML=html;
  }
</script>
</body>
</html>
