<!DOCTYPE html>
<html>
<head>
  <title>Data Program - Kalisari27</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
    body { background: #f4f6f9; padding: 20px; }
.container { max-width: 800px; margin: auto; }
.back { display: inline-block; margin-bottom: 15px; text-decoration: none; color: #3498db; font-weight: bold; }
.box { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
.box h2 { margin-bottom: 20px; border-bottom: 1px solid #eee; padding-bottom: 10px; }
  label { font-weight: bold; font-size: 14px; margin-top: 10px; display: block; }
  input { width: 100%; padding: 12px; margin: 8px 0 15px 0; border: 1px solid #ddd; border-radius: 8px; font-size: 15px; }
  textarea { width: 100%; padding: 12px; margin: 8px 0 15px 0; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; resize: vertical; }
.btn { padding: 12px 20px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
.btn-save { background: #2ecc71; color: white; width: 100%; }
.btn-edit { background: #3498db; color: white; padding: 6px 10px; font-size: 12px; }
.btn-del { background: #e74c3c; color: white; padding: 6px 10px; font-size: 12px; }
.btn-hide { background: #e67e22; color: white; padding: 6px 10px; font-size: 12px; }
.msg { text-align: center; margin-top: 10px; font-weight: bold; }
.error { color: #e74c3c; }.success { color: #2ecc71; }
.badge-psm { background: #9b59b6; color: white; font-size: 10px; padding: 3px 8px; border-radius: 5px; margin-left: 8px; }
.badge-hidden { background: #95a5a6; color: white; font-size: 10px; padding: 3px 8px; border-radius: 5px; margin-left: 8px; }
.badge-catatan { background: #f1c40f; color: #856404; font-size: 10px; padding: 3px 8px; border-radius: 5px; margin-left: 8px; }
.hidden { display: none; }
.item-group { display: grid; grid-template-columns: 1fr 80px 1fr; gap: 8px; align-items: center; margin-bottom:10px; }
  table { width: 100%; border-collapse: collapse; margin-top: 10px; }
  table th, table td { padding: 12px; text-align: left; border-bottom: 1px solid #eee; font-size:14px; }
  table th { background: #f4f6f9; }
.no-data { text-align: center; color: #777; }
.akses-ditolak { text-align: center; padding: 50px; color: #e74c3c; font-weight: bold; }
  footer { text-align: center; padding: 20px; margin-top: 30px; color: #777; font-size: 16px; border-top: 1px solid #eee; }
  footer b { color: #2c3e50; }
  </style>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>
  <div class="container" id="mainContainer">
    <div id="aksesBlokir" class="akses-ditolak" style="display:none;">
      <h2>🚫 Akses Ditolak</h2>
      <p>Hanya Admin yang bisa mengakses halaman ini</p>
      <a href="dashboard.html" class="back">← Kembali ke Dashboard</a>
    </div>
    <div id="kontenAdmin">
      <a href="dashboard.html" class="back">← Kembali ke Dashboard</a>
      <div class="box">
        <h2>📦 Data Program</h2>
        <input type="hidden" id="editId">
        <label>Nama Program</label>
        <input type="text" id="namaProgram" placeholder="Contoh: PSM September 2026">

        <label>Catatan Program (opsional) <small style="font-weight:normal; color:#777;">— ga muncul di nama, cuma info kecil di dashboard & input</small></label>
        <textarea id="catatanProgram" rows="2" placeholder="Contoh: Khusus migrasi, area JKT only, minimal 3 bulan"></textarea>

        <label style="display:flex; align-items:center; gap:10px; margin:15px 0;">
          <input type="checkbox" id="isPsm" style="width:auto; margin:0;" onchange="togglePsm()">
          <span>Jadikan Program PSM <small style="font-weight:normal; color:#777;">Target diisi per item</small></span>
        </label>
        <div id="boxReguler">
          <label>Target Qty Total</label>
          <input type="number" id="targetQty" placeholder="Contoh: 50">
        </div>
        <div id="boxItems" class="hidden">
          <label>Isi 10 Item PSM + Target + Catatan per Item (opsional)</label>
          <div id="itemsContainer"></div>
        </div>
        <button class="btn btn-save" onclick="simpanProgram()">SIMPAN PROGRAM</button>
        <p id="msg" class="msg"></p>
      </div>
      <div class="box">
        <h2>📋 Daftar Program</h2>
        <table id="tabelProgram">
          <thead><tr><th>Nama Program</th><th>Type</th><th>Aksi</th></tr></thead>
          <tbody><tr><td colspan="3" class="no-data">Loading...</td></tr></tbody>
        </table>
      </div>
    </div>
    <footer>Powered by <b>DevancaProject</b> © 2026</footer>
  </div>
<script>
  const firebaseConfig = {apiKey: "AIzaSyAcXcQndDOfBrpgGhGRWDnD8vn0XX4npP8",authDomain: "devancaproject.firebaseapp.com",databaseURL: "https://devancaproject-default-rtdb.asia-southeast1.firebasedatabase.app",projectId: "devancaproject",storageBucket: "devancaproject.firebasestorage.app",messagingSenderId: "435221444634",appId: "1:435221444634:web:7fe0f742fbfa9c448239a3"};
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();
  let role = localStorage.getItem('role');
  let currentUser = localStorage.getItem('currentUser');
  function buatInputItem(values = []){
    let container = document.getElementById('itemsContainer');
    container.innerHTML = '';
    for(let i=0; i<10; i++){
      container.innerHTML += `
        <div class="item-group">
          <input type="text" id="itemNama${i}" placeholder="Nama Item ${i+1}" value="${(values[i]?.nama || '').replace(/"/g,'&quot;')}">
          <input type="number" id="itemTarget${i}" placeholder="Target" value="${values[i]?.target || ''}">
          <input type="text" id="itemCatatan${i}" placeholder="Catatan item ${i+1} (opsional)" value="${(values[i]?.catatan || '').replace(/"/g,'&quot;')}">
        </div>
      `;
    }
  }
  buatInputItem();
  function togglePsm(){
    let cek = document.getElementById('isPsm').checked;
    document.getElementById('boxItems').classList.toggle('hidden',!cek);
    document.getElementById('boxReguler').classList.toggle('hidden', cek);
  }
  window.onload = function(){
    if(!currentUser){window.location = 'login.html'; return;}
    if(role!== 'admin'){document.getElementById('kontenAdmin').style.display = 'none'; document.getElementById('aksesBlokir').style.display = 'block'; return;}
    loadData();
  }
  function toggleHide(id){
    let statusBaru =!semuaProgram[id].is_hidden;
    db.ref('program/' + id).update({ is_hidden: statusBaru });
  }
  let semuaProgram = {};
  function loadData(){
    db.ref('program').on('value', (snapshot) => {
      semuaProgram = {};
      let tbody = document.querySelector('#tabelProgram tbody');
      tbody.innerHTML = '';
      if(snapshot.numChildren() == 0){tbody.innerHTML = `<tr><td colspan="3" class="no-data">Belum ada data program</td></tr>`; return;}
      snapshot.forEach(child => {
        let id = child.key; let data = child.val();
        semuaProgram[id] = data;
        let type = data.is_psm? `<span class="badge-psm">PSM</span>` : 'Reguler';
        let hiddenBadge = data.is_hidden? `<span class="badge-hidden">HIDDEN</span>` : '';
        let catatanBadge = data.catatan? `<span class="badge-catatan">📝 ada catatan</span>` : '';
        let textTombol = data.is_hidden? '👁️ Tampilkan' : '🙈 Sembunyikan';
        tbody.innerHTML += `<tr>
          <td><b>${data.nama}</b> ${hiddenBadge} ${catatanBadge}<br><small style="color:#777; font-style:italic;">${data.catatan? '📝 '+data.catatan : ''}</small></td>
          <td>${type}</td>
          <td>
            <button class="btn btn-hide" onclick="toggleHide('${id}')">${textTombol}</button>
            <button class="btn btn-edit" onclick='editProgram("${id}")'>Edit</button>
            <button class="btn btn-del" onclick="hapusProgram('${id}')">Hapus</button>
          </td>
        </tr>`;
      });
    });
  }
  function simpanProgram(){
    let id = document.getElementById('editId').value;
    let nama = document.getElementById('namaProgram').value.trim();
    let catatan = document.getElementById('catatanProgram').value.trim();
    let is_psm = document.getElementById('isPsm').checked;
    let msg = document.getElementById('msg');
    if(nama == ''){msg.innerText = 'Nama Program wajib diisi'; msg.className = 'msg error'; return;}
    let data = {nama: nama, catatan: catatan, is_psm: is_psm};
    if(id!== ''){
      data.is_hidden = semuaProgram[id].is_hidden || false;
    }
    if(is_psm){
      let items = [];
      for(let i=0; i<10; i++){
        let namaItem = document.getElementById(`itemNama${i}`).value.trim();
        let targetItem = Number(document.getElementById(`itemTarget${i}`).value) || 0;
        let catatanItem = document.getElementById(`itemCatatan${i}`).value.trim();
        if(namaItem) items.push({nama: namaItem, target: targetItem, catatan: catatanItem});
      }
      if(items.length === 0){msg.innerText = 'Isi minimal 1 item untuk PSM'; msg.className = 'msg error'; return;}
      data.items = items;
      delete data.target;
    } else {
      let target = document.getElementById('targetQty').value;
      if(target == '' || Number(target) <= 0){msg.innerText = 'Target harus lebih dari 0'; msg.className = 'msg error'; return;}
      data.target = Number(target);
      delete data.items;
    }
    let ref = id == ''? db.ref('program').push(data) : db.ref('program/' + id).update(data);
    ref.then(()=>{resetForm(); msg.innerText = 'Program berhasil disimpan'; msg.className = 'msg success'; setTimeout(()=>msg.innerText='',3000);});
  }
  function editProgram(id){
    let data = semuaProgram[id];
    document.getElementById('editId').value = id;
    document.getElementById('namaProgram').value = data.nama || '';
    document.getElementById('catatanProgram').value = data.catatan || '';
    document.getElementById('isPsm').checked = data.is_psm || false;
    togglePsm();
    if(data.is_psm){buatInputItem(data.items);} else {document.getElementById('targetQty').value = data.target || ''; buatInputItem();}
    document.querySelector('.btn-save').innerText = 'UPDATE PROGRAM';
    window.scrollTo(0,0);
  }
  function hapusProgram(id){if(confirm('Yakin mau hapus program ini?')){db.ref('program/' + id).remove();}}
  function resetForm(){document.getElementById('editId').value = '';document.getElementById('namaProgram').value = '';document.getElementById('catatanProgram').value = '';document.getElementById('targetQty').value = '';document.getElementById('isPsm').checked = false;togglePsm();buatInputItem();document.querySelector('.btn-save').innerText = 'SIMPAN PROGRAM';}
</script>
</body>
</html>
