<!DOCTYPE html>
<html>
<head>
<title>Dalam Pengembangan - Kalisari27</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap');
:root{
  --bg:#f0f2f5; --card:#ffffff; --text:#1e293b; --sub:#64748b; --border:#e2e8f0;
  --primary:#667eea; --primary-dark:#764ba2;
}
html.dark,body.dark{
  --bg:#121416; --card:#1e2227; --text:#f1f5f9; --sub:#94a3b8; --border:#2d333b;
}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif}
body{
  background:var(--bg); color:var(--text);
  min-height:100vh; display:flex; align-items:center; justify-content:center;
  padding:20px; padding-bottom:90px; overflow:hidden;
}
.bg-blob{position:fixed; width:400px; height:400px; border-radius:50%; filter:blur(90px); opacity:.25; z-index:-1}
.blob1{background:#667eea; top:-100px; left:-100px; animation:float 6s infinite ease-in-out}
.blob2{background:#ff8c42; bottom:-120px; right:-80px; animation:float 8s infinite ease-in-out reverse}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-20px)}}
.card{
  background:var(--card); border:1px solid var(--border);
  border-radius:24px; padding:32px 24px; max-width:380px; width:100%;
  text-align:center; box-shadow:0 20px 60px rgba(0,0,0,.08);
  animation:up .6s ease;
}
@keyframes up{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
.logo{height:46px; background:white; padding:5px 12px; border-radius:10px; border:2px solid #E30613; margin-bottom:18px}
.icon-box{
  width:80px; height:80px; margin:0 auto 18px;
  background:linear-gradient(135deg,var(--primary),var(--primary-dark));
  border-radius:20px; display:flex; align-items:center; justify-content:center;
  box-shadow:0 10px 25px rgba(102,126,234,.4);
  animation:pulse 2s infinite;
}
@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.05)}100%{transform:scale(1)}}
.icon-box svg{width:36px;height:36px;stroke:white;fill:none;stroke-width:2}
h1{font-size:20px; font-weight:700; margin-bottom:8px}
p.desc{font-size:13px; color:var(--sub); line-height:1.6; margin-bottom:20px}
.badge{display:inline-flex; align-items:center; gap:6px; background:#fef3c7; color:#92400e; border:1px solid #fde68a; padding:6px 12px; border-radius:20px; font-size:11px; font-weight:700; margin-bottom:20px}
html.dark .badge{background:#3a2e0f; color:#fde68a; border-color:#5a4a1f}
.progress{width:100%; height:8px; background:var(--bg); border-radius:10px; overflow:hidden; margin-bottom:18px; border:1px solid var(--border)}
.progress-bar{height:100%; width:65%; background:linear-gradient(90deg,var(--primary),var(--primary-dark)); border-radius:10px; animation:load 2.5s ease-in-out infinite}
@keyframes load{0%{width:10%}50%{width:70%}100%{width:65%}}
.btns{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:10px}
.btn{padding:12px; border-radius:12px; border:none; font-weight:700; font-size:13px; cursor:pointer; text-decoration:none; display:flex; align-items:center; justify-content:center; gap:6px}
.btn-primary{background:linear-gradient(135deg,var(--primary),var(--primary-dark)); color:white; box-shadow:0 6px 15px rgba(102,126,234,.3)}
.btn-secondary{background:var(--bg); color:var(--text); border:1px solid var(--border)}
.foot{margin-top:18px; font-size:10px; color:var(--sub)}
</style>
</head>
<body>
<div class="bg-blob blob1"></div>
<div class="bg-blob blob2"></div>

<div class="card">
  <img src="../../asset/logo-kalisari27.png" onerror="this.src='../asset/logo-kalisari27.png'" class="logo" alt="Kalisari27">

  <div class="icon-box">
    <svg viewBox="0 0 24 24"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.3-3.3a1 1 0 0 0 0-1.4l-1.6-1.6a1 1 0 0 0-1.4 0l-3.3 3.3z"/><path d="M12 22a1 1 0 0 1 0-2h-1a4 4 0 0 1-4-4V7a1 1 0 0 0-2 0v9a6 6 0 0 0 6 6h1z"/><path d="M12 8a2 2 0 1 0 0 4 2 2 0 0 0 0-4z"/></svg>
  </div>

  <h1>Apps Dalam Pengembangan</h1>
  <p class="desc">Fitur ini lagi kita racik <b>perform IKT</b>. mohon ditunggu</p>

  <div class="badge">🚧 65% • Segera Rilis</div>

  <div class="progress"><div class="progress-bar"></div></div>

  <div class="btns">
    <a class="btn btn-primary" href="../../launcher/">🏠 Kembali ke Home</a>
    <a class="btn btn-secondary" onclick="history.back()">← Kembali</a>
  </div>

  <div class="foot">Kalisari27 • devancaproject • <span id="jam"></span></div>
</div>

<script>
setInterval(()=>{document.getElementById('jam').innerText=new Date().toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'})},1000);
if(localStorage.getItem('theme')==='dark'){document.documentElement.classList.add('dark');document.body.classList.add('dark');}
</script>
</body>
</html>
