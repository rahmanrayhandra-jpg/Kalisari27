<!DOCTYPE html>
<html>
<head>
  <title>Stok Opname - Kalisari27</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap');
    :root {
      --bg: #f0f2f5; --card: #ffffff; --text: #333; --subtext: #777; --border: #ddd;
      --primary: #667eea; --primary-dark: #764ba2; --success: #28a745; --danger: #dc3545; --warning: #6c757d;
      --navbar: rgba(255,255,255,0.92); --card2:#f0f2f5;
    }
    html.dark, body.dark {
      --bg: #1a1d21; --card: #2c3136; --text: #ecf0f1; --subtext: #bdc3c7; --border: #444;
      --primary: #5a67d8; --primary-dark: #553c9a; --navbar: rgba(30,30,30,0.92); --card2:#252525;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
    body { background: var(--bg); color: var(--text); transition: 0.3s; padding-top: 70px; padding-bottom: 90px; }
.navbar{position:fixed;top:0;left:0;right:0;background:var(--navbar);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:8px 14px;display:flex;justify-content:space-between;align-items:center;z-index:1000;height:62px}
.nav-left{display:flex;align-items:center;gap:10px}
.logo-img{height:40px;background:white;padding:3px 8px;border-radius:8px;border:2px solid #E30613}
.app-title{line-height:1.1}.app-title b{font-size:14px}.app-title small{display:block;font-size:10px;color:var(--subtext);font-weight:600}
.theme-toggle{width:60px;height:32px;background:var(--border);border-radius:50px;display:flex;align-items:center;justify-content:space-between;padding:0 6px;cursor:pointer}
.container{padding:20px;max-width:1000px;margin:auto}
.card{background:var(--card);padding:22px;border-radius:16px;box-shadow:0 5px 15px rgba(0,0,0,0.06);margin-bottom:18px;border:1px solid var(--border);border-left:5px solid var(--primary)}
    h2{margin-bottom:15px;color:var(--text);font-size:16px}
.total-box{background:linear-gradient(135deg,var(--primary) 0%,var(--primary-dark) 100%);color:white;padding:20px;border-radius:12px;text-align:center;margin-bottom:20px}
.total-box h3{font-size:12px;opacity:.9}.total-box h1{font-size:30px;margin-top:5px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    input,select{width:100%;padding:12px;border:1px solid var(--border);border-radius:10px;font-size:14px;background:var(--card2);color:var(--text)}
.upload-box{grid-column:1/-1;border:2px dashed var(--primary);padding:15px;border-radius:12px;text-align:center;background:var(--card2)}
.btn-kamera{background:var(--success);color:white;padding:12px;border:none;border-radius:10px;width:100%;cursor:pointer;font-weight:700;margin-bottom:10px}
.btn-file{background:var(--warning);color:white;padding:12px;border:none;border-radius:10px;width:100%;cursor:pointer;font-weight:700}
.preview-img{width:100%;max-width:250px;height:200px;object-fit:cover;border-radius:10px;margin-top:10px;border:1px solid var(--border)}
.btn-simpan{background:linear-gradient(135deg,var(--primary) 0%,var(--primary-dark) 100%);color:white;border:none;padding:14px 25px;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;margin-top:15px;width:100%}
.filter-box{display:flex;gap:10px;margin-bottom:15px;flex-wrap:wrap;align-items:center}
.btn-reset{background:#fff;color:var(--danger);border:1.5px solid var(--danger);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:700;font-size:11px}
.table-wrapper{width:100%;overflow-x:auto;border-radius:10px}
    table{width:100%;border-collapse:collapse;margin-top:15px;min-width:850px}th{background:var(--primary);color:white;padding:12px;text-align:left;white-space:nowrap}td{padding:12px;border-bottom:1px solid var(--border);white-space:nowrap;font-size:13px}
.foto-cell img{width:70px;height:70px;object-fit:cover;border-radius:8px;cursor:pointer;border:2px solid var(--primary)}.btn-hapus{background:var(--danger);color:white;border:none;padding:5px 10px;border-radius:5px;cursor:pointer}
.pagination{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-top:15px;flex-wrap:wrap}.pages{display:flex;gap:6px;flex-wrap:wrap}.pagination button{padding:8px 14px;border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:8px;cursor:pointer;font-weight:600;min-width:40px}.pagination button.active{background:var(--primary);color:white}.pag-info{font-size:11px;color:var(--subtext)}
.modal{display:none;position:fixed;z-index:100;left:0;top:0;width:100%;height:100%;background:rgba(0,0,0,0.8);justify-content:center;align-items:center}.modal-content{max-width:90%;max-height:90%;border-radius:10px}.close-modal{position:absolute;top:20px;right:30px;color:white;font-size:40px;cursor:pointer}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;height:64px;background:rgba(255,255,255,0.96);backdrop-filter:blur(16px);border-top:1px solid var(--border);display:flex;justify-content:space-around;align-items:center;z-index:999;padding:0 6px}
.nav-item{display:flex;flex-direction:column;align-items:center;justify-content:center;text-decoration:none;color:var(--subtext);font-size:10px;font-weight:700;flex:1;height:100%;gap:3px;border:none;background:none;cursor:pointer}.nav-icon svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.9}.nav-item.active{color:#8B4513}.nav-center{width:48px;height:48px;background:linear-gradient(135deg,#8B4513,#FF8C42);border-radius:14px;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(139,69,19,0.35);border:none;margin-top:-10px}.nav-center svg{width:22px;height:22px;stroke:white;fill:none;stroke-width:2.2}
  </style>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>
  <div class="navbar">
    <div class="nav-left">
      <img src="../../asset/logo-kalisari27.png" onerror="this.src='logo-kalisari27.png'" class="logo-img">
      <div class="app-title"><b>STOK OPNAME</b><small id="namaUser">Kalisari27 • Loading</small></div>
    </div>
    <div class="theme-toggle" id="btnTheme"><span>☀️</span><span>🌙</span></div>
  </div>
  <div class="container">
    <div class="card" id="sectionInput">
      <h2>📝 Input Stok Opname</h2>
      <div class="form-grid">
        <input type="date" id="tanggal" required>
        <input type="text" id="noKoreksi" placeholder="No Koreksi" required>
        <input type="text" id="itemTertinggi" placeholder="Item Koreksi Tertinggi" required>
        <input type="number" id="selisih" placeholder="Selisih Qty" required>
        <input type="number" id="rpItem" placeholder="Rp Item Tertinggi" required>
        <input type="text" id="keterangan" placeholder="Keterangan / Lokasi Rak" style="grid-column: 1 / -1;">
        <div class="upload-box">
          <label>📸 Bukti Foto</label>
          <input type="file" id="fotoKamera" accept="image/*" capture="environment" style="display:none;" onchange="previewFoto(event)">
          <input type="file" id="fotoFile" accept="image/*" style="display:none;" onchange="previewFoto(event)">
          <button class="btn-kamera" onclick="document.getElementById('fotoKamera').click()">📷 Ambil Foto</button>
          <button class="btn-file" onclick="document.getElementById('fotoFile').click()">🖼️ Pilih dari Galeri</button>
          <img id="preview" class="preview-img" style="display:none;">
          <p id="sizeInfo" style="font-size:12px;color:var(--primary);margin-top:5px"></p>
        </div>
      </div>
      <button class="btn-simpan" id="btnSimpan" onclick="simpanData()">💾 Simpan Data</button>
      <p id="msg" style="margin-top:10px; font-weight:bold; text-align:center;"></p>
    </div>
    <div class="card" id="sectionRiwayat">
      <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; margin-bottom:10px;">
        <h2 style="margin:0">📊 Riwayat Stok Opname</h2>
        <button class="btn-reset" onclick="resetData()">🗑️ Reset Bulan Ini (Jadi 0)</button>
      </div>
      <div class="total-box"><h3>Total Selisih Semua Data</h3><h1 id="totalSelisih">0</h1></div>
      <div class="filter-box">
        <div style="display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600">Tampilkan <select id="limitData" onchange="gantiLimit()"><option value="5">5</option><option value="10" selected>10</option><option value="25">25</option><option value="50">50</option></select></div>
        <input type="date" id="filterTanggal" onchange="gantiHalaman(1)">
        <input type="text" id="filterSearch" placeholder="Cari No Koreksi/Item..." onkeyup="gantiHalaman(1)">
        <button onclick="loadData()" style="padding:8px 12px;border-radius:8px;border:1px solid var(--border);background:var(--card);cursor:pointer;font-weight:600">🔄 Refresh</button>
      </div>
      <div class="table-wrapper">
        <table id="tabelRiwayat"><thead><tr><th>Tanggal</th><th>No Koreksi</th><th>Item</th><th>Rp Item</th><th>Selisih</th><th>Foto</th><th>Petugas</th><th>Ket</th><th>Aksi</th></tr></thead><tbody><tr><td colspan="9" style="text-align:center;padding:20px;color:var(--primary)">Loading 100 terbaru...</td></tr></tbody></table>
      </div>
      <div class="pagination" id="pagination"></div>
    </div>
  </div>
  <div id="modalGambar" class="modal" onclick="tutupModal()"><span class="close-modal">&times;</span><img class="modal-content" id="imgBesar"></div>
  <div class="bottom-nav">
    <button class="nav-item" onclick="document.getElementById('sectionInput').scrollIntoView({behavior:'smooth'})"><span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></span><span>Input</span></button>
    <button class="nav-item active" onclick="document.getElementById('sectionRiwayat').scrollIntoView({behavior:'smooth'})"><span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/></svg></span><span>Riwayat</span></button>
    <div style="flex:0.2"></div>
    <button class="nav-item" onclick="location.href='../../launcher/'"><span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1h-5v-4a1 1 0 0 0-1-1h-2a1 1 0 0 0-1 1v4H4a1 1 0 0 1-1-1V9.5z"/></svg></span><span>Home</span></button>
    <button class="nav-item"><div class="nav-center"><svg viewBox="0 0 24 24"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><path d="M3.3 7L12 12l8.7-5"/><path d="M12 22V12"/></svg></div></button>
  </div>
<script>
  const firebaseConfig = {apiKey: "AIzaSyAcXcQndDOfBrpgGhGRWDnD8vn0XX4npP8",authDomain: "devancaproject.firebaseapp.com",databaseURL: "https://devancaproject-default-rtdb.asia-southeast1.firebasedatabase.app",projectId: "devancaproject",storageBucket: "devancaproject.firebasestorage.app",messagingSenderId: "435221444634",appId: "1:435221444634:web:7fe0f742fbfa9c448239a3"};
  firebase.initializeApp(firebaseConfig); const db = firebase.database();
  // FIX PEAK 55 - AUTO OFFLINE
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) firebase.database().goOffline();
    else firebase.database().goOnline();
  });
  window.addEventListener('beforeunload', () => firebase.database().goOffline());
  let idleTimer;
  function resetIdle(){
    clearTimeout(idleTimer);
    idleTimer = setTimeout(()=>{ firebase.database().goOffline(); }, 10*60*1000);
  }
  ['click','touchstart','keydown','mousemove'].forEach(ev=>document.addEventListener(ev,resetIdle));
  resetIdle();

  let fotoBase64=""; let halamanSekarang=1; let dataPerHalaman=10; let semuaData=[];
  document.getElementById('tanggal').valueAsDate=new Date();
  document.getElementById('namaUser').innerText=(localStorage.getItem('currentUser')||'User')+' • Kalisari27';
  const btnTheme=document.getElementById('btnTheme'); if(localStorage.getItem('theme')==='dark'){document.documentElement.classList.add('dark');document.body.classList.add('dark');}
  btnTheme.addEventListener('click',()=>{document.documentElement.classList.toggle('dark');document.body.classList.toggle('dark');localStorage.setItem('theme',document.documentElement.classList.contains('dark')?'dark':'light');});
  loadData();
  function kompresGambar(file,maxWidth=600,quality=0.5){return new Promise((resolve)=>{let reader=new FileReader();reader.onload=function(e){let img=new Image();img.onload=function(){let canvas=document.createElement('canvas');let ctx=canvas.getContext('2d');let width=img.width;let height=img.height;if(width>maxWidth){height=(maxWidth/width)*height;width=maxWidth;}canvas.width=width;canvas.height=height;ctx.drawImage(img,0,0,width,height);resolve(canvas.toDataURL('image/jpeg',quality));};img.src=e.target.result;};reader.readAsDataURL(file);});}
  async function previewFoto(event){let file=event.target.files[0];if(!file)return;document.getElementById('sizeInfo').innerText='⏳ Mengkompres...';fotoBase64=await kompresGambar(file);document.getElementById('preview').src=fotoBase64;document.getElementById('preview').style.display='block';let sizeKB=Math.round(fotoBase64.length/1024);document.getElementById('sizeInfo').innerText=`✅ ${sizeKB} KB`;}
  function simpanData(){let btn=document.getElementById('btnSimpan');let msg=document.getElementById('msg');let tanggal=document.getElementById('tanggal').value;let noKoreksi=document.getElementById('noKoreksi').value;let item=document.getElementById('itemTertinggi').value;let selisih=parseInt(document.getElementById('selisih').value);let rpItem=parseInt(document.getElementById('rpItem').value);let ket=document.getElementById('keterangan').value;let petugas=localStorage.getItem('currentUser');if(!tanggal||!noKoreksi||!item||isNaN(selisih)||isNaN(rpItem)){msg.innerText='⚠️ Isi semua field!';msg.style.color='red';return;}if(fotoBase64==""){msg.innerText='⚠️ Wajib foto!';msg.style.color='red';return;}btn.disabled=true;btn.innerText='⏳ Menyimpan...';msg.innerText='';let dataBaru={tanggal,noKoreksi,item,selisih,rpItem,ket,petugas,foto:fotoBase64,createdAt:Date.now()};db.ref('stokopname').push(dataBaru).then(()=>{msg.innerText='✅ Berhasil!';msg.style.color='green';document.querySelectorAll('#sectionInput input').forEach(i=>{if(i.id!='tanggal'&&i.type!='file') i.value='';});document.getElementById('tanggal').valueAsDate=new Date();document.getElementById('preview').style.display='none';document.getElementById('sizeInfo').innerText='';fotoBase64=""; loadData();}).catch((e)=>{msg.innerText='❌ Gagal: '+e.message;msg.style.color='red';}).finally(()=>{btn.disabled=false;btn.innerText='💾 Simpan Data';});}
  function loadData(){ db.ref('stokopname').orderByChild('createdAt').limitToLast(100).once('value').then((snap)=>{ semuaData=[]; snap.forEach(child=>{semuaData.push({id:child.key,...child.val()});}); semuaData.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0)); gantiHalaman(1); }); }
  function formatRupiah(a){return new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',minimumFractionDigits:0}).format(a||0);}
  function tampilkanTabel(){let tbody=document.querySelector('#tabelRiwayat tbody');let filterTgl=document.getElementById('filterTanggal').value;let filterCari=document.getElementById('filterSearch').value.toLowerCase();let dataFilter=semuaData.filter(d=>{let cocokTgl=filterTgl?d.tanggal==filterTgl:true;let cocokCari=(d.noKoreksi||'').toLowerCase().includes(filterCari)||(d.item||'').toLowerCase().includes(filterCari);return cocokTgl&&cocokCari;});document.getElementById('totalSelisih').innerText=dataFilter.reduce((s,d)=>s+(d.selisih||0),0);let totalHalaman=Math.ceil(dataFilter.length/dataPerHalaman)||1;if(halamanSekarang>totalHalaman) halamanSekarang=totalHalaman;let start=(halamanSekarang-1)*dataPerHalaman;let dataHalaman=dataFilter.slice(start,start+dataPerHalaman);if(dataHalaman.length==0){tbody.innerHTML='<tr><td colspan="9" style="text-align:center;">Belum ada data (100 terbaru)</td></tr>';}else{tbody.innerHTML='';dataHalaman.forEach(d=>{let foto=d.foto?`<img src="${d.foto}" onclick="bukaModal(this.src)">`:'-';tbody.innerHTML+=`<tr><td>${d.tanggal}</td><td>${d.noKoreksi}</td><td>${d.item}</td><td>${formatRupiah(d.rpItem)}</td><td>${d.selisih}</td><td class="foto-cell">${foto}</td><td>${d.petugas}</td><td>${d.ket}</td><td><button class="btn-hapus" onclick="hapusData('${d.id}')">Hapus</button></td></tr>`;});}buatPagination(totalHalaman,dataFilter.length);}
  function buatPagination(totalHalaman,totalData){let p=document.getElementById('pagination');p.innerHTML='';let start=(halamanSekarang-1)*dataPerHalaman+1;let end=Math.min(halamanSekarang*dataPerHalaman,totalData);let info=totalData==0?'0 data':`${start}-${end} dari ${totalData} (100 terbaru)`;let h='<div class="pages">';h+=`<button ${halamanSekarang==1?'disabled':''} onclick="gantiHalaman(${halamanSekarang-1})">‹ Prev</button>`;for(let i=1;i<=totalHalaman&&i<=5;i++){h+=`<button class="${i==halamanSekarang?'active':''}" onclick="gantiHalaman(${i})">${i}</button>`;}h+=`<button ${halamanSekarang==totalHalaman?'disabled':''} onclick="gantiHalaman(${halamanSekarang+1})">Next ›</button></div>`;p.innerHTML=`<div class="pag-info">${info}</div>`+h;}
  function gantiHalaman(hal){if(hal<1)return;halamanSekarang=hal;tampilkanTabel();}
  function gantiLimit(){dataPerHalaman=parseInt(document.getElementById('limitData').value);halamanSekarang=1;tampilkanTabel();}
  function bukaModal(src){document.getElementById('modalGambar').style.display='flex';document.getElementById('imgBesar').src=src;}
  function tutupModal(){document.getElementById('modalGambar').style.display='none';}
  function hapusData(id){if(confirm('Yakin hapus?')){db.ref('stokopname/'+id).remove().then(()=>loadData());}}
  function resetData(){
    let filterVal=document.getElementById('filterTanggal').value;
    let targetDate=filterVal?new Date(filterVal):new Date();
    let bulanStr=targetDate.toLocaleDateString('id-ID',{month:'long',year:'numeric'});
    if(!confirm(`Yakin RESET jadi 0 untuk ${filterVal?'tanggal '+filterVal:'BULAN '+bulanStr.toUpperCase()}?\nBackup otomatis ke-download dulu.`)) return;
    db.ref('stokopname').once('value').then(snap=>{
      let semua=[]; snap.forEach(c=>semua.push({id:c.key,...c.val()}));
      let dataTarget=semua.filter(d=>{
        let t=new Date(d.tanggal);
        if(filterVal) return d.tanggal===filterVal;
        else return t.getMonth()===targetDate.getMonth() && t.getFullYear()===targetDate.getFullYear();
      });
      if(dataTarget.length===0){alert('Gak ada data di '+(filterVal?'tanggal '+filterVal:'bulan '+bulanStr));return;}
      let blob=new Blob([JSON.stringify(dataTarget,null,2)],{type:'application/json'});
      let a=document.createElement('a'); a.href=URL.createObjectURL(blob);
      a.download=`backup-stokopname-${filterVal||(targetDate.getMonth()+1)+'-'+targetDate.getFullYear()}.json`; a.click();
      let ketik=prompt(`Mau hapus ${dataTarget.length} data jadi 0?\nKETIK: HAPUS`); if(ketik!=='HAPUS'){alert('Batal');return;}
      Promise.all(dataTarget.map(d=>db.ref('stokopname/'+d.id).remove())).then(()=>{alert(`✅ ${dataTarget.length} data berhasil dihapus jadi 0`); loadData();});
    });
  }
</script>
<script src="../../asset/auto-offline.js"></script>
</body>
</html>
