<!DOCTYPE html>
<html>
<head>
  <title>Stok Opname - Kalisari27</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    :root {
      --bg: #f0f2f5;
      --card: #ffffff;
      --text: #333;
      --subtext: #777;
      --border: #ddd;
      --primary: #667eea;
      --primary-dark: #764ba2;
      --success: #28a745;
      --danger: #dc3545;
      --warning: #6c757d;
    }
    html.dark {
      --bg: #1a1d21;
      --card: #2c3136;
      --text: #ecf0f1;
      --subtext: #bdc3c7;
      --border: #444;
      --primary: #5a67d8;
      --primary-dark: #553c9a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
    body { background: var(--bg); color: var(--text); transition: 0.3s; }
    header {
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      color: white; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1); position: sticky; top: 0; z-index: 10;
    }
    header h1 { font-size: 20px; }
    nav a { color: white; text-decoration: none; margin: 0 15px; padding: 8px 12px; border-radius: 8px; transition: 0.3s; }
    nav a.active, nav a:hover { background: rgba(255,255,255,0.2); }
.logout-btn { background: white; color: var(--primary); border: none; padding: 8px 15px; border-radius: 8px; cursor: pointer; font-weight: bold; }
.btn-theme { background: rgba(255,255,255,0.2); color: white; border: 1px solid white; padding: 8px 12px; border-radius: 8px; cursor: pointer; font-size: 18px; margin-right: 10px; }
.container { padding: 30px; max-width: 1200px; margin: auto; }
.card { background: var(--card); padding: 25px; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.08); margin-bottom: 20px; }
    h2 { margin-bottom: 15px; color: var(--text); }
.total-box { background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%); color: white; padding: 20px; border-radius: 12px; text-align: center; margin-bottom: 20px; }
.total-box h3 { font-size: 14px; opacity: 0.9; }
.total-box h1 { font-size: 32px; margin-top: 5px; }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    input, select { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 10px; font-size: 15px; background: var(--bg); color: var(--text); }
    input:focus, select:focus { outline: none; border-color: var(--primary); }
.upload-box { grid-column: 1 / -1; border: 2px dashed var(--primary); padding: 15px; border-radius: 10px; text-align: center; }
.upload-box label { display: block; margin-bottom: 10px; font-weight: bold; color: var(--primary); }
.btn-kamera { background: var(--success); color: white; padding: 12px; border: none; border-radius: 10px; width: 100%; cursor: pointer; font-weight: bold; margin-bottom: 10px; }
.btn-file { background: var(--warning); color: white; padding: 12px; border: none; border-radius: 10px; width: 100%; cursor: pointer; font-weight: bold; }
.preview-img { width: 100%; max-width: 250px; height: 200px; object-fit: cover; border-radius: 10px; margin-top: 10px; border: 1px solid var(--border); }
.btn-simpan { background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%); color: white; border: none; padding: 14px 25px; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 15px; width: 100%; }
.btn-simpan:disabled { background: #ccc; cursor: not-allowed; }
.filter-box { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
.filter-box input { flex: 1; min-width: 150px; }
.table-wrapper { width: 100%; overflow-x: auto; border-radius: 10px; }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; min-width: 850px; }
    th { background: var(--primary); color: white; padding: 12px; text-align: left; white-space: nowrap; position: sticky; top: 0; }
    td { padding: 12px; border-bottom: 1px solid var(--border); white-space: nowrap; }
.selisih-minus { color: var(--danger); font-weight: bold; }
.selisih-plus { color: var(--text); font-weight: bold; }
.foto-cell img { width: 70px; height: 70px; object-fit: cover; border-radius: 8px; cursor: pointer; border: 2px solid var(--primary); }
.btn-hapus { background: var(--danger); color: white; border: none; padding: 5px 10px; border-radius: 5px; cursor: pointer; }
.pagination { display: flex; justify-content: center; gap: 10px; margin-top: 15px; }
.pagination button { padding: 8px 15px; border: 1px solid var(--primary); background: var(--card); color: var(--primary); border-radius: 8px; cursor: pointer; }
.pagination button.active { background: var(--primary); color: white; }
.modal { display: none; position: fixed; z-index: 100; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; }
.modal-content { max-width: 90%; max-height: 90%; border-radius: 10px; }
.close-modal { position: absolute; top: 20px; right: 30px; color: white; font-size: 40px; cursor: pointer; }
.loading { text-align: center; padding: 20px; color: var(--primary); }
.size-info { font-size: 12px; color: var(--primary); margin-top: 5px; }
    @media(max-width: 768px){.form-grid { grid-template-columns: 1fr; } }
  </style>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>
  <header>
    <h1>🐝 KALISARI27</h1>
    <nav>
      <a href="dashboard.html">Dashboard</a>
      <a href="stockopname.html" class="active">Stok Opname</a>
    </nav>
    <div>
      <button class="btn-theme" id="btnTheme">🌙</button>
      <button class="logout-btn" onclick="logout()">Logout</button>
    </div>
  </header>

  <div class="container">
    <div class="card">
      <h2>📝 Input Stok Opname</h2>
      <div class="form-grid">
        <input type="date" id="tanggal" required>
        <input type="text" id="noKoreksi" placeholder="No Koreksi" required>
        <input type="text" id="itemTertinggi" placeholder="Item Koreksi Tertinggi" required>
        <input type="number" id="selisih" placeholder="Selisih Qty" required>
        <input type="number" id="rpItem" placeholder="Rp Item Tertinggi" required>
        <input type="text" id="keterangan" placeholder="Keterangan / Lokasi Rak" style="grid-column: 1 / -1;">

        <div class="upload-box">
          <label>📸 Bukti Foto <small style="color:var(--subtext)">(Auto Kompres)</small></label>
          <input type="file" id="fotoKamera" accept="image/*" capture="environment" style="display:none;" onchange="previewFoto(event)">
          <input type="file" id="fotoFile" accept="image/*" style="display:none;" onchange="previewFoto(event)">
          <button class="btn-kamera" onclick="document.getElementById('fotoKamera').click()">📷 Ambil Foto</button>
          <button class="btn-file" onclick="document.getElementById('fotoFile').click()">🖼️ Pilih dari Galeri</button>
          <img id="preview" class="preview-img" style="display:none;">
          <p id="sizeInfo" class="size-info"></p>
        </div>
      </div>
      <button class="btn-simpan" id="btnSimpan" onclick="simpanData()">💾 Simpan Data</button>
      <p id="msg" style="margin-top:10px; font-weight:bold; text-align:center;"></p>
    </div>

    <div class="card">
      <h2>📊 Riwayat Stok Opname - Semua User</h2>
      <div class="total-box">
        <h3>Total Selisih Semua Data</h3>
        <h1 id="totalSelisih">0</h1>
      </div>
      <div class="filter-box">
        <input type="date" id="filterTanggal" onchange="gantiHalaman(1)">
        <input type="text" id="filterSearch" placeholder="Cari No Koreksi/Item..." onkeyup="gantiHalaman(1)">
      </div>
      <div class="table-wrapper">
        <table id="tabelRiwayat">
          <thead>
            <tr>
              <th>Tanggal</th><th>No Koreksi</th><th>Item Koreksi Tertinggi</th><th>Rp Item Tertinggi</th>
              <th>Selisih</th><th>Foto</th><th>Petugas</th><th>Keterangan</th><th>Aksi</th>
            </tr>
          </thead>
          <tbody><tr><td colspan="9" class="loading">Loading data...</td></tr></tbody>
        </table>
      </div>
      <div class="pagination" id="pagination"></div>
    </div>
  </div>

  <div id="modalGambar" class="modal" onclick="tutupModal()">
    <span class="close-modal">&times;</span>
    <img class="modal-content" id="imgBesar">
  </div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyAcXcQndDOfBrpgGhGRWDnD8vn0XX4npP8",
    authDomain: "devancaproject.firebaseapp.com",
    databaseURL: "https://devancaproject-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "devancaproject",
    storageBucket: "devancaproject.firebasestorage.app",
    messagingSenderId: "435221444634",
    appId: "1:435221444634:web:7fe0f742fbfa9c448239a3"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  if(localStorage.getItem('login')!= 'true'){ window.location.href = 'index.html'; }

  let fotoBase64 = "";
  let halamanSekarang = 1;
  const dataPerHalaman = 5;
  let semuaData = [];

  document.getElementById('tanggal').valueAsDate = new Date();

  // ===== LOGIC DARK MODE GLOBAL =====
  const btnTheme = document.getElementById('btnTheme');
  const currentTheme = localStorage.getItem('theme');
  if(currentTheme === 'dark'){
    document.documentElement.classList.add('dark');
    btnTheme.innerText = '☀️';
  }

  btnTheme.addEventListener('click', () => {
    document.documentElement.classList.toggle('dark');
    if(document.documentElement.classList.contains('dark')){
      localStorage.setItem('theme', 'dark');
      btnTheme.innerText = '☀️';
    } else {
      localStorage.setItem('theme', 'light');
      btnTheme.innerText = '🌙';
    }
  });

  loadData();

  // ===== AUTO LOGOUT 5 MENIT + DETEKSI MINIMIZE =====
  let waktuLogout = 5 * 60 * 1000;
  let timerLogout;
  let waktuMulaiTersembunyi = null;

  function resetTimer() {
    clearTimeout(timerLogout);
    timerLogout = setTimeout(logoutOtomatis, waktuLogout);
  }

  function logoutOtomatis() {
    alert('⚠️ Sesi anda habis 5 menit. Anda akan di logout otomatis.');
    localStorage.clear();
    window.location.href = 'index.html';
  }

  window.onload = resetTimer;
  document.onmousemove = resetTimer;
  document.onkeydown = resetTimer;
  document.onclick = resetTimer;
  document.onscroll = resetTimer;

  document.addEventListener('visibilitychange', function() {
    if (document.hidden) {
      waktuMulaiTersembunyi = Date.now();
    } else {
      if (waktuMulaiTersembunyi) {
        let lamaTersembunyi = Date.now() - waktuMulaiTersembunyi;
        if (lamaTersembunyi >= waktuLogout) {
          logoutOtomatis();
        } else {
          resetTimer();
        }
      }
    }
  });

  function kompresGambar(file, maxWidth = 800, quality = 0.7) {
    return new Promise((resolve) => {
      let reader = new FileReader();
      reader.onload = function(e) {
        let img = new Image();
        img.onload = function() {
          let canvas = document.createElement('canvas');
          let ctx = canvas.getContext('2d');
          let width = img.width; let height = img.height;
          if (width > maxWidth) { height = (maxWidth / width) * height; width = maxWidth; }
          canvas.width = width; canvas.height = height;
          ctx.drawImage(img, 0, 0, width, height);
          let compressedBase64 = canvas.toDataURL('image/jpeg', quality);
          resolve(compressedBase64);
        }
        img.src = e.target.result;
      }
      reader.readAsDataURL(file);
    });
  }

  async function previewFoto(event){
    let file = event.target.files[0];
    if(!file) return;
    document.getElementById('sizeInfo').innerText = '⏳ Mengkompres...';
    fotoBase64 = await kompresGambar(file);
    document.getElementById('preview').src = fotoBase64;
    document.getElementById('preview').style.display = 'block';
    let sizeKB = Math.round(fotoBase64.length / 1024);
    document.getElementById('sizeInfo').innerText = `✅ Ukuran: ${sizeKB} KB`;
  }

  function simpanData(){
    let btn = document.getElementById('btnSimpan');
    let msg = document.getElementById('msg');
    let tanggal = document.getElementById('tanggal').value;
    let noKoreksi = document.getElementById('noKoreksi').value;
    let item = document.getElementById('itemTertinggi').value;
    let selisih = parseInt(document.getElementById('selisih').value);
    let rpItem = parseInt(document.getElementById('rpItem').value);
    let ket = document.getElementById('keterangan').value;
    let petugas = localStorage.getItem('currentUser');

    if(!tanggal ||!noKoreksi ||!item || isNaN(selisih) || isNaN(rpItem)){ msg.innerText = '⚠️ Isi semua field wajib!'; msg.style.color = 'red'; return; }
    if(fotoBase64 == ""){ msg.innerText = '⚠️ Wajib upload foto bukti!'; msg.style.color = 'red'; return; }

    btn.disabled = true; btn.innerText = '⏳ Menyimpan...'; msg.innerText = '';

    let dataBaru = { tanggal, noKoreksi, item, selisih, rpItem, ket, petugas, foto: fotoBase64, createdAt: Date.now() };

    db.ref('stokopname').push(dataBaru).then(() => {
      msg.innerText = '✅ Data berhasil disimpan!'; msg.style.color = 'green';
      document.querySelectorAll('input').forEach(i => { if(i.id!= 'tanggal' && i.type!= 'file') i.value = ''; });
      document.getElementById('preview').style.display = 'none';
      document.getElementById('sizeInfo').innerText = '';
      document.getElementById('fotoKamera').value = "";
      document.getElementById('fotoFile').value = "";
      fotoBase64 = "";
    }).catch((error) => {
      msg.innerText = '❌ Gagal: ' + error.message; msg.style.color = 'red';
    }).finally(() => {
      btn.disabled = false; btn.innerText = '💾 Simpan Data';
    });
  }

  function loadData(){
    db.ref('stokopname').on('value', (snapshot) => {
      semuaData = [];
      snapshot.forEach(child => { semuaData.push({id: child.key,...child.val()}); });
      semuaData.sort((a,b) => b.createdAt - a.createdAt);
      gantiHalaman(1);
    });
  }

  function formatRupiah(angka){
    return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(angka || 0);
  }

  function tampilkanTabel(){
    let tbody = document.querySelector('#tabelRiwayat tbody');
    let filterTgl = document.getElementById('filterTanggal').value;
    let filterCari = document.getElementById('filterSearch').value.toLowerCase();

    let dataFilter = semuaData.filter(d => {
      let cocokTgl = filterTgl? d.tanggal == filterTgl : true;
      let cocokCari = d.noKoreksi.toLowerCase().includes(filterCari) || d.item.toLowerCase().includes(filterCari);
      return cocokTgl && cocokCari;
    });

    let total = dataFilter.reduce((sum, d) => sum + (d.selisih || 0), 0);
    document.getElementById('totalSelisih').innerText = total;

    let totalHalaman = Math.ceil(dataFilter.length / dataPerHalaman);
    let start = (halamanSekarang - 1) * dataPerHalaman;
    let dataHalaman = dataFilter.slice(start, start + dataPerHalaman);

    if(dataHalaman.length == 0){ tbody.innerHTML = '<tr><td colspan="9" style="text-align:center;">Belum ada data</td></tr>'; }
    else {
      tbody.innerHTML = '';
      dataHalaman.forEach(d => {
        let classSelisih = d.selisih < 0? 'selisih-minus' : 'selisih-plus';
        let fotoHtml = d.foto? `<img src="${d.foto}" onclick="bukaModal('${d.foto}')">` : '-';
        tbody.innerHTML += `<tr><td>${d.tanggal}</td><td>${d.noKoreksi}</td><td>${d.item}</td><td>${formatRupiah(d.rpItem)}</td><td class="${classSelisih}">${d.selisih}</td><td class="foto-cell">${fotoHtml}</td><td>${d.petugas}</td><td>${d.ket}</td><td><button class="btn-hapus" onclick="hapusData('${d.id}')">Hapus</button></td></tr>`;
      });
    }
    buatPagination(totalHalaman);
  }

  function buatPagination(totalHalaman){
    let pagination = document.getElementById('pagination');
    pagination.innerHTML = '';
    for(let i = 1; i <= totalHalaman; i++){
      pagination.innerHTML += `<button class="${i == halamanSekarang? 'active' : ''}" onclick="gantiHalaman(${i})">${i}</button>`;
    }
  }
  function gantiHalaman(hal){ halamanSekarang = hal; tampilkanTabel(); }
  function bukaModal(src){ document.getElementById('modalGambar').style.display = 'flex'; document.getElementById('imgBesar').src = src; }
  function tutupModal(){ document.getElementById('modalGambar').style.display = 'none'; }

  function hapusData(id){
    if(confirm('Yakin mau hapus data ini?')){
      db.ref('stokopname/' + id).remove();
    }
  }
  function logout(){ localStorage.clear(); window.location.href = 'index.html'; }
</script>
</body>
</html>
