<!DOCTYPE html>
<html>
<head>
  <title>Profil - Kalisari27</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
    body { background: #f4f6f9; padding: 20px; }
 .container { max-width: 800px; margin: auto; }
 .back { display: inline-block; margin-bottom: 15px; text-decoration: none; color: #3498db; font-weight: bold; }

 .box { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
 .box h2 { margin-bottom: 20px; border-bottom: 1px solid #eee; padding-bottom: 10px; }

 .profil-header { display: flex; align-items: center; gap: 20px; margin-bottom: 20px; }
 .profil-header img { width: 80px; height: 80px; border-radius: 50%; object-fit: cover; border: 3px solid #3498db; }
 .profil-header h3 { margin: 0; }
 .badge { font-size: 12px; padding: 4px 8px; border-radius: 5px; color: white; }
 .badge.admin { background: #e74c3c; }.badge.XC23 { background: #3498db; }

    label { font-weight: bold; font-size: 14px; margin-top: 10px; display: block; }
    input { width: 100%; padding: 12px; margin: 8px 0 15px 0; border: 1px solid #ddd; border-radius: 8px; font-size: 15px; }
 .btn { padding: 12px 20px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; }
 .btn-save { background: #2ecc71; color: white; }
 .btn-save:disabled { background: #95a5a6; cursor: not-allowed; }
 .btn-del { background: #e74c3c; color: white; padding: 6px 10px; font-size: 12px; width: auto; }
 .msg { text-align: center; margin-top: 10px; font-weight: bold; }
 .error { color: #e74c3c; }.success { color: #2ecc71; }

    table { width: 100%; border-collapse: collapse; }
    table th, table td { padding: 12px; text-align: left; border-bottom: 1px solid #eee; }
    table th { background: #f4f6f9; }

    footer { text-align: center; padding: 20px; margin-top: 30px; color: #777; font-size: 16px; border-top: 1px solid #eee; }
    footer b { color: #2c3e50; }
  </style>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <!-- HAPUS STORAGE -->
</head>
<body>
  <div class="container">
    <a href="dashboard.html" class="back">← Kembali ke Dashboard</a>

    <!-- PROFIL SAYA -->
    <div class="box">
      <h2>👤 Profil Saya</h2>
      <div class="profil-header">
        <img id="fotoProfil" src="" alt="Foto Profil">
        <div>
          <h3 id="namaProfil"></h3>
          <span id="roleProfil" class="badge"></span>
        </div>
      </div>

      <label>Upload Foto Baru <small style="color:#777;">Max 1MB</small></label>
      <input type="file" id="inputFoto" accept="image/*">

      <label>Ganti Password</label>
      <input type="password" id="passLama" placeholder="Password Lama">
      <input type="password" id="passBaru" placeholder="Password Baru">
      <input type="password" id="passKonfirmasi" placeholder="Konfirmasi Password Baru">

      <button class="btn btn-save" onclick="updateProfil()">SIMPAN PERUBAHAN</button>
      <p id="msg" class="msg"></p>
    </div>

    <!-- DAFTAR USER - CUMA MUNCUL KALO ADMIN -->
    <div class="box" id="boxDaftarUser" style="display:none;">
      <h2>👥 Daftar Semua User</h2>
      <table id="tabelUser">
        <thead><tr><th>Foto</th><th>Username</th><th>Role</th><th>Aksi</th></tr></thead>
        <tbody><tr><td colspan="4">Loading...</td></tr></tbody>
      </table>
    </div>

    <footer>Powered by <b>DevancaProject</b> © 2026</footer>
  </div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyAcXcQndDOfBrpgGhGRWDnD8vn0XX4npP8",
    authDomain: "devancaproject.firebaseapp.com",
    databaseURL: "https://devancaproject-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "devancaproject",
    storageBucket: "devancaproject.firebasestorage.app",
    messagingSenderId: "435221444634",
    appId: "1:435221444634:web:7fe0f742fbfa9c448239a3"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();
  // STORAGE DIHAPUS

  let currentUser = localStorage.getItem('currentUser');
  let role = localStorage.getItem('role');

  // LOAD DATA PROFIL DARI FIREBASE
  db.ref('users/' + currentUser).on('value', (snapshot) => {
    let data = snapshot.val();
    if(!data) return;
    document.getElementById('namaProfil').innerText = currentUser;
    document.getElementById('roleProfil').innerText = data.role;
    document.getElementById('roleProfil').className = 'badge ' + data.role;
    if(data.fotoBase64){ // GANTI JADI fotoBase64
      document.getElementById('fotoProfil').src = data.fotoBase64;
    }
  });

  // KALO ADMIN, TAMPILIN TABEL DAFTAR USER
  if(role == 'admin'){
    document.getElementById('boxDaftarUser').style.display = 'block';
    db.ref('users').on('value', (snapshot) => {
      let tbody = document.querySelector('#tabelUser tbody');
      tbody.innerHTML = '';
      snapshot.forEach(child => {
        let username = child.key;
        let data = child.val();
        let foto = data.fotoBase64 || 'https://i.imgur.com/I80W1Q6.png'; // GANTI JADI fotoBase64
        let btnHapus = (username!= currentUser)? `<button class="btn-del" onclick="hapusUser('${username}')">Hapus</button>` : '';
        tbody.innerHTML += `
          <tr>
            <td><img src="${foto}" style="width:40px; height:40px; border-radius:50%; object-fit:cover;"></td>
            <td>${username}</td>
            <td><span class="badge ${data.role}">${data.role}</span></td>
            <td>${btnHapus}</td>
          </tr>
        `;
      });
    });
  }

  // FUNGSI UPDATE PROFIL - VERSI GRATIS BASE64
  async function updateProfil(){
    let passLama = document.getElementById('passLama').value;
    let passBaru = document.getElementById('passBaru').value;
    let passKonfirmasi = document.getElementById('passKonfirmasi').value;
    let file = document.getElementById('inputFoto').files[0];
    let msg = document.getElementById('msg');
    let btn = document.querySelector('.btn-save');

    msg.innerText = 'Menyimpan...';
    msg.className = 'msg';
    btn.disabled = true;
    btn.innerText = 'Menyimpan...';

    let updateData = {};
    let adaPerubahan = false;

    try {
      // 1. CEK GANTI PASSWORD
      if(passBaru!= ''){
        if(passBaru!= passKonfirmasi){ throw new Error('Password baru tidak sama!'); }

        let snap = await db.ref('users/' + currentUser + '/password').once('value');
        if(snap.val()!= passLama){ throw new Error('Password lama salah!'); }

        updateData.password = passBaru;
        adaPerubahan = true;
      }

      // 2. CEK UPLOAD FOTO -> CONVERT KE BASE64
      if(file){
        if(file.size > 1000000){ throw new Error('Ukuran foto max 1MB'); } // biar ga berat
        let base64 = await toBase64(file);
        updateData.fotoBase64 = base64; // simpen di DB
        adaPerubahan = true;
      }

      // 3. UPDATE KE DB
      if(adaPerubahan){
        await db.ref('users/' + currentUser).update(updateData);
        msg.innerText = 'Profil berhasil diupdate!';
        msg.className = 'msg success';
        document.getElementById('passLama').value = '';
        document.getElementById('passBaru').value = '';
        document.getElementById('passKonfirmasi').value = '';
        document.getElementById('inputFoto').value = '';
      } else {
        msg.innerText = 'Tidak ada perubahan';
        msg.className = 'msg error';
      }

    } catch (error) {
      msg.innerText = error.message;
      msg.className = 'msg error';
    }

    btn.disabled = false;
    btn.innerText = 'SIMPAN PERUBAHAN';
  }

  // FUNGSI CONVERT FILE KE BASE64
  function toBase64(file){
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.readAsDataURL(file);
      reader.onload = () => resolve(reader.result);
      reader.onerror = error => reject(error);
    });
  }

  function hapusUser(username){
    if(confirm(`Yakin mau hapus user ${username}?`)){
      db.ref('users/' + username).remove();
    }
  }
</script>
</body>
</html>
