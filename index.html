<!DOCTYPE html>
<html>
<head>
  <title>Login - KALISARI27</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
    
    body {
      height: 100vh; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      position: relative;
      overflow: hidden;
    }
    
    /* SLIDESHOW BACKGROUND JERNIH 100% */
    .bg-slider {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      z-index: -1;
    }
    
    .bg-slide {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      opacity: 0;
      animation: fadeSlide 15s infinite;
      filter: brightness(1);
    }
    
    .bg-slide:nth-child(1) { background-image: url('depan.jpg'); animation-delay: 0s; }
    .bg-slide:nth-child(2) { background-image: url('store.jpg'); animation-delay: 5s; }
    .bg-slide:nth-child(3) { background-image: url('kasir.jpg'); animation-delay: 10s; }
    
    @keyframes fadeSlide {
      0% { opacity: 0; transform: scale(1.05); }
      10% { opacity: 1; transform: scale(1); }
      30% { opacity: 1; transform: scale(1); }
      40% { opacity: 0; transform: scale(1); }
      100% { opacity: 0; transform: scale(1.05); }
    }
    
    body::before { 
      content: ''; 
      position: absolute; 
      top: 0; left: 0; right: 0; bottom: 0; 
      background: rgba(0,0,0,0.05); 
      z-index: 0;
    }

    /* TOMBOL PEMBUKA */
    .btn-opener {
      position: relative;
      z-index: 2;
      padding: 18px 45px;
      background: rgba(255,255,255,0.95);
      color: #667eea;
      border: none;
      border-radius: 50px;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 2px;
      cursor: pointer;
      box-shadow: 0 15px 40px rgba(0,0,0,0.3);
      animation: pulse 2s infinite;
      transition: 0.3s;
    }
    .btn-opener:hover {
      transform: scale(1.05);
      box-shadow: 0 20px 50px rgba(102,126,234,0.4);
    }
    @keyframes pulse {
      0%,100% { transform: scale(1); }
      50% { transform: scale(1.03); }
    }

    /* WRAPPER LOGIN DI BAWAH */
    .login-wrapper {
      position: absolute;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%) translateY(150%);
      width: 100%;
      display: flex;
      justify-content: center;
      transition: 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55);
      z-index: 1;
    }
    .login-wrapper.active {
      transform: translateX(-50%) translateY(0);
    }

    .container { 
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(8px); 
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.2); 
      padding: 18px 22px; 
      border-radius: 16px; 
      width: 100%; 
      max-width: 480px; 
      box-shadow: 0 10px 30px rgba(0,0,0,0.2); 
      position: relative; 
    }
    
    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }
    
    .logo { font-size: 32px; filter: drop-shadow(0 3px 8px rgba(0,0,0,0.3)); }
    
    h2 { 
      color: white; 
      font-weight: 700;
      font-size: 17px; 
      letter-spacing: 2px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.7);
    }
    
    .tabs { 
      display: flex; 
      background: rgba(255,255,255,0.12); 
      border-radius: 10px; 
      padding: 3px; 
      margin-bottom: 14px; 
    }
    
    .tab { 
      flex: 1; 
      padding: 7px; 
      text-align: center; 
      cursor: pointer; 
      color: white; 
      border-radius: 7px; 
      transition: 0.3s; 
      font-weight: 600; 
      font-size: 12px;
      text-shadow: 0 1px 3px rgba(0,0,0,0.4);
    }
    
    .tab.active { 
      background: rgba(255,255,255,0.9);
      color: #667eea; 
    }
    
    .form-row {
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }
    
    .input-group { flex: 1; position: relative; }
    
    input { 
      width: 100%; 
      padding: 10px 12px; 
      border: 1px solid rgba(255,255,255,0.3);
      border-radius: 10px; 
      background: rgba(255,255,255,0.1);
      color: white; 
      font-size: 13px; 
    }
    
    .input-group input { padding-right: 35px; }
    input::placeholder { color: rgba(255,255,255,0.8); }
    input:focus { background: rgba(255,255,255,0.2); border-color: white; outline: none; }
    
    .toggle-pass { 
      position: absolute; 
      right: 10px; 
      top: 50%; 
      transform: translateY(-50%); 
      cursor: pointer; 
      font-size: 15px; 
      opacity: 0.8;
    }
    
    .btn-login {
      padding: 10px 20px; 
      background: rgba(255,255,255,0.9);
      color: #667eea; 
      border: none; 
      border-radius: 10px; 
      font-size: 13px; 
      font-weight: 700; 
      cursor: pointer; 
      transition: 0.3s; 
      white-space: nowrap;
    }
    .btn-login:hover { background: white; transform: translateY(-2px); }
    
    .msg { 
      text-align: center; 
      margin-top: 8px; 
      font-size: 12px; 
      display: none; 
      font-weight: 600; 
      padding: 6px;
      border-radius: 6px;
    }
    
    .error { color: #fff; background: rgba(255,107,107,0.7); } 
    .success { color: #fff; background: rgba(81,207,102,0.7); }
    
    .form { display: none; } 
    .form.active { display: block; }
    
    footer { 
      text-align: center; 
      margin-top: 12px; 
      color: rgba(255,255,255,0.9);
      font-size: 11px; 
      text-shadow: 0 1px 3px rgba(0,0,0,0.5);
    }

    /* TOMBOL TUTUP */
    .btn-close {
      position: absolute;
      top: -12px;
      right: -12px;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: white;
      color: #667eea;
      border: none;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }
    
    @media (max-width: 520px) {
      .container { max-width: 90%; }
      .form-row { flex-direction: column; gap: 8px; }
      .btn-login { width: 100%; }
      .btn-opener { font-size: 16px; padding: 15px 35px; }
    }
  </style>
  
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>
  <!-- SLIDESHOW BACKGROUND -->
  <div class="bg-slider">
    <div class="bg-slide"></div>
    <div class="bg-slide"></div>
    <div class="bg-slide"></div>
  </div>

  <!-- TOMBOL PEMBUKA -->
  <button class="btn-opener" onclick="openLogin()">GAS JUALAN 🔥📢</button>

  <!-- WRAPPER LOGIN -->
  <div class="login-wrapper" id="loginWrapper">
    <div class="container">
      <button class="btn-close" onclick="closeLogin()">×</button>
      
      <div class="header">
        <div class="logo">🐝</div>
        <h2>KALISARI27</h2>
      </div>
      
      <div class="tabs">
        <div class="tab active" onclick="showForm('login', event)">Login</div>
        <div class="tab" onclick="showForm('register', event)">Daftar</div>
      </div>

      <div id="login" class="form active">
        <div class="form-row">
          <input type="text" id="loginUser" placeholder="Username">
          <div class="input-group">
            <input type="password" id="loginPass" placeholder="Password">
            <span class="toggle-pass" onclick="togglePassword('loginPass')">👁️</span>
          </div>
          <button class="btn-login" onclick="login()">MASUK</button>
        </div>
        <p id="loginMsg" class="msg"></p>
      </div>

      <div id="register" class="form">
        <div class="form-row">
          <input type="text" id="regUser" placeholder="Username Baru">
          <div class="input-group">
            <input type="password" id="regPass" placeholder="Password">
            <span class="toggle-pass" onclick="togglePassword('regPass')">👁️</span>
          </div>
          <button class="btn-login" onclick="register()">DAFTAR</button>
        </div>
        <p id="regMsg" class="msg"></p>
      </div>
      
      <footer>DevancaProject © 2026</footer>
    </div>
  </div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyAcXcQndDOfBrpgGhGRWDnD8vn0XX4npP8",
    authDomain: "devancaproject.firebaseapp.com",
    databaseURL: "https://devancaproject-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "devancaproject",
    storageBucket: "devancaproject.firebasestorage.app",
    messagingSenderId: "435221444634",
    appId: "1:435221444634:web:7fe0f742fbfa9c448239a3"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  function openLogin() {
    document.getElementById('loginWrapper').classList.add('active');
    document.querySelector('.btn-opener').style.display = 'none';
  }
  function closeLogin() {
    document.getElementById('loginWrapper').classList.remove('active');
    document.querySelector('.btn-opener').style.display = 'block';
  }

  function showForm(id, event){
    document.querySelectorAll('.form').forEach(f => f.classList.remove('active'));
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    event.target.classList.add('active');
  }

  function togglePassword(id){
    let input = document.getElementById(id);
    let icon = input.nextElementSibling;
    if(input.type === "password"){ input.type = "text"; icon.innerText = "🙈"; } 
    else { input.type = "password"; icon.innerText = "👁️"; }
  }

  function register(){
    let user = document.getElementById('regUser').value;
    let pass = document.getElementById('regPass').value;
    let msg = document.getElementById('regMsg');
    if(user == '' || pass == ''){ msg.innerText = 'Isi semua!'; msg.className = 'msg error'; msg.style.display = 'block'; return; }
    db.ref('users/' + user).once('value').then((snapshot) => {
      if(snapshot.exists()){ msg.innerText = 'Username sudah dipakai!'; msg.className = 'msg error'; msg.style.display = 'block'; }
      else { db.ref('users/' + user).set({password: pass, role: 'sales'}).then(() => {
        msg.innerText = 'Daftar berhasil!'; msg.className = 'msg success'; msg.style.display = 'block'; 
        setTimeout(() => showForm('login', {target: document.querySelector('.tab')}), 1500); 
      });}
    });
  }

  function login(){
    let user = document.getElementById('loginUser').value;
    let pass = document.getElementById('loginPass').value;
    let msg = document.getElementById('loginMsg');
    
    db.ref('users/' + user).once('value').then((snapshot) => {
      if(snapshot.exists() && snapshot.val().password === pass){
        localStorage.setItem('currentUser', user);
        localStorage.setItem('role', snapshot.val().role);
        localStorage.setItem('login', 'true');
        window.location.href = 'dashboard.html';
      } else {
        msg.innerText = 'Username/Password salah!'; msg.className = 'msg error'; msg.style.display = 'block';
      }
    });
  }

  if(localStorage.getItem('login') == 'true'){ window.location.href = 'dashboard.html'; }
  db.ref('users/admin').once('value').then(snap => { if(!snap.exists()){ db.ref('users/admin').set({password: 'admin123', role: 'admin'}); } });
</script>
</body>
  </html>
